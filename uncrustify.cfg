# ==========================================
# LANGUAGE
# ==========================================
file_lang = C

# ==========================================
# INDENTATION (Linux kernel basics)
# ==========================================
indent_with_tabs = 1         # Leading indentation uses tabs
indent_columns    = 8        # Tab width

# ==========================================
# COMMENT CONVERSION
# ==========================================
# Convert C++ // comments to /* */ comments
comment_convert_to_c = true

# Do not wrap or reflow comments
cmt_reflow   = false
cmt_reformat = false

# Keep banner comments using lots of "/" intact
cmt_preserve_banners = true

# Don’t try to adjust URLs like http://
cmt_convert_urls = false

# Minimal spacing in /* ... */
cmt_sp_before_star = false
cmt_sp_after_star  = true

# ==========================================
# ONE-LINERS (prevent brace churn)
# ==========================================
keep_one_line_blocks     = true
keep_one_line_statements = true

# =======================
